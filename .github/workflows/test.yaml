name: Build and test preview RPM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build RPM and test thumbnail previews
        run: tools/build-rpm.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: celluloid-preview-fedora44
          path: |
            build-output/RPMS/**/*.rpm
            build-output/SRPMS/*.rpm
          if-no-files-found: error
